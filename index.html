<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>J-Mart</title>
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="top"><div class="logo"><span style="font-size:38px">🛒</span><div><b>J-Mart</b><small>Fresh Needs, Happy Homes</small></div></div>
<nav><a onclick="scrollTo(0,0)"><span>🏠</span>Home</a><a onclick="alert(cart.size+' item(s) in cart')"><span>🛒</span>Cart<i id="cc">0</i></a><a><span>👤</span>Login</a></nav></div>
<label class="search"><input id="q" type="search" placeholder="Search for products..." autocomplete="off">🔍</label></header>
<section class="hero"><p class="e">WELCOME TO J-MART</p><h1>Your Daily Essentials Delivered Fresh</h1><p>Groceries · Household · Better Living</p><button class="btn" onclick="document.getElementById('pl').scrollIntoView({behavior:'smooth'})">Shop Now &nbsp;→</button></section>
<div class="wrap"><div class="cats"><h2>☷ Categories</h2><div class="cg" id="cg"></div></div>
<div class="bar" id="pl"><h2><span id="ct">All Products</span> <small id="n"></small></h2>
<select id="s"><option value="p">Sort by: Popularity</option><option value="a">Name: A–Z</option><option value="z">Name: Z–A</option></select></div>
<div class="grid" id="g"></div><div id="empty" hidden>No products found.</div></div>
<script src="script.js"></script></body></html>
