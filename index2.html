<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>J-Mart - Products</title>
<style>
:root{--g:#078a5c;--dg:#0b5d3f;--bd:#e3e8e6;--tx:#1d2b36;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;font-family:Roboto,system-ui,sans-serif;color:var(--tx);background:#fff}
header{padding:14px 16px 12px;position:sticky;top:0;background:#fff;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}.logo b{font-size:28px;color:var(--g);display:block;line-height:1}.logo small{font-size:12px}
nav{display:flex;gap:18px}nav a{text-align:center;font-size:13px;font-weight:600;color:var(--dg);position:relative;cursor:pointer}nav a span{display:block;font-size:22px}
#cc{position:absolute;top:-6px;right:-8px;background:#e11;color:#fff;border-radius:50%;width:19px;height:19px;font-size:11px;line-height:19px}
.search{margin-top:12px;display:flex;border:1px solid var(--bd);background:#f5f7f6;border-radius:30px;padding:0 16px}
.search input{flex:1;border:0;background:none;height:44px;font-size:16px;outline:0}
.hero{padding:26px 20px;background:linear-gradient(135deg,#e8f4d9,#d4ebb9)}
.hero p.e{letter-spacing:3px;font-weight:700;color:var(--g);font-size:12px;margin:0}
.hero h1{font-size:28px;color:var(--dg);margin:10px 0}.hero p{margin:0 0 16px;font-weight:500}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:13px 22px;font-size:16px;font-weight:700}
.wrap{padding:16px}.cats{border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.cats h2{margin:0;background:var(--g);color:#fff;padding:16px;font-size:20px}
.cg{display:grid;grid-template-columns:1fr 1fr}.cg button{border:0;border-bottom:1px solid var(--bd);background:#fff;padding:14px;text-align:left;font-size:15px;font-weight:600;color:var(--tx)}
.cg button.on{background:#e3f4ec}
.bar{display:flex;justify-content:space-between;align-items:center;margin:22px 0 14px;gap:8px}
.bar h2{margin:0;font-size:22px}.bar h2 small{font-weight:400;color:#777;font-size:14px}
select{border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:14px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1px solid var(--bd);border-radius:14px;padding:10px;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:contain}.card h3{font-size:14px;margin:8px 0;flex:1}
.card button{border:1.5px solid var(--g);color:var(--g);background:#fff;border-radius:10px;padding:9px;font-weight:700}
.card button.in{background:var(--g);color:#fff}
#empty{text-align:center;color:#777;padding:30px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.cg{grid-template-columns:repeat(4,1fr)}}
nav em{font-style:normal}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:center;justify-content:center}
#ov[hidden],#cp[hidden],#lf[hidden]{display:none}
#cp{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:#fff;display:flex;flex-direction:column}
#cp h2,#lf h2{margin:0;padding:16px;background:var(--g);color:#fff;font-size:20px;display:flex;justify-content:space-between}
.x{background:none;border:0;color:#fff;font-size:20px}
#ci{flex:1;overflow:auto;padding:8px 14px}#cf{padding:14px;border-top:1px solid var(--bd)}
.ci{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.ci img{width:52px;height:52px;object-fit:contain}.ci span{flex:1;font-size:14px;font-weight:600}
.q{display:flex;align-items:center;gap:8px}.q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--g);background:#fff;color:var(--g);font-weight:700}
.rm{border:0;background:none;font-size:18px}
#lf{background:#fff;border-radius:16px;overflow:hidden;width:min(360px,92%)}
#lf input{display:block;width:calc(100% - 32px);margin:14px 16px 0;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px}
#lf .btn{margin:16px;width:calc(100% - 32px)}
.muted{text-align:center;color:#777;padding:30px}
.pr{font-weight:700;color:var(--g);margin:0 0 8px}
</style></head><body>
<header><div class="top"><div class="logo"><span style="font-size:38px">🛒</span><div><b>J-Mart</b><small>Fresh Needs, Happy Homes</small></div></div>
<nav><a onclick="goHome()" href="index.html"><span>🏠</span>Home</a><a onclick="openCart()"><span>🛒</span>Cart<i id="cc">0</i></a><a onclick="openLogin()"><span>👤</span><em id="lg">Login</em></a></nav></div>
<label class="search"><input id="q" type="search" placeholder="Search for products..." autocomplete="off">🔍</label></header>
<div class="wrap"><div class="cats"><h2>☷ Categories</h2><div class="cg" id="cg"></div></div>
<div class="bar" id="pl"><h2><span id="ct">All Products</span> <small id="n"></small></h2>
<select id="s"><option value="p">Sort by: Popularity</option><option value="a">Name: A–Z</option><option value="z">Name: Z–A</option></select></div>
<div class="grid" id="g"></div><div id="empty" hidden>No products found.</div></div>
<div id="ov" hidden onclick="if(event.target===this)closeAll()">
<aside id="cp" hidden><h2>🛒 Your Cart <button class="x" onclick="closeAll()">✕</button></h2><div id="ci"></div><div id="cf"></div></aside>
<form id="lf" hidden onsubmit="doLogin(event)"><h2>👤 Login <button type="button" class="x" onclick="closeAll()">✕</button></h2>
<input id="un" placeholder="Name" required><input id="em" type="email" placeholder="Email" required><input id="pw" type="password" placeholder="Password" minlength="4" required><button class="btn">Login</button></form></div>
<script>
const D=[
"Aashirvaad Iodized Salt|2|28",
"Ariel Complete Plus|5|130",
"Bingo Cheese Nachos|0|20",
"Bingo Hashtags Spicy Masala|0|20",
"Bingo Korean Style Hot Spicy|0|20",
"Bingo Mad Angles|0|20",
"Bingo Original Style Chilli|0|20",
"Bingo Tedhe Medhe Masala Tadka|0|20",
"Bingo Tedhe Medhe Mast Masala Tadka|0|20",
"Bounty|0|20",
"Britannia Good Day Butter Cookies|0|35",
"Brooke Bond 3 Roses Natural Care|4|120",
"Brooke Bond Red Label|4|130",
"Brooke Bond Taj Mahal|4|150",
"Cadbury Dairy Milk|0|40",
"Cadbury Dairy Milk Silk|0|80",
"Cadbury Oreo Original|0|30",
"Campa Cola|3|40",
"Cinthol Lime Soap|6|35",
"Closeup Everfresh Toothpaste|6|90",
"Coca Cola|3|40",
"Colgate MaxFresh Toothpaste|6|95",
"Colgate Strong Teeth Toothpaste|6|85",
"Colgate ZigZag Charcoal Toothbrush|6|50",
"Colgate ZigZag Deep Clean Toothbrush|6|45",
"Dabur Red Toothpaste|6|95",
"Dark Fantasy Desserts Choco Chunks|0|40",
"Dark Fantasy Desserts Choco Nut Dipped|0|45",
"Dark Fantasy Sandwich Creme Chocolate|0|35",
"Dark Fantasy Sandwich Creme Vanilla|0|35",
"Dove Cream Beauty Bar|6|65",
"Dove Intense Repair Shampoo|6|180",
"Fogg Paradise Body Spray|6|220",
"Garlic|7|40",
"Groundnuts|1|90",
"Hauser XO Pens|5|50",
"Head and Shoulders Classic Clean|6|180",
"Head and Shoulders Cool Menthol|6|185",
"KitKat 2 Finger|0|20",
"KitKat 4 Finger|0|40",
"Lays American Style Cream Onion|0|20",
"Lotte Choco Pie|0|30",
"Minute Maid Pulpy Orange|3|40",
"Mysore Sandal Soap|6|55",
"Nature Power Papaya Aura Soap|6|45",
"Pantene Lively Clean|6|190",
"Parle Hide and Seek Almonds|0|35",
"Parle Hide and Seek Choco Chip|0|30",
"Parrys White Label Sugar|2|50",
"Pears Original Glycerin Soap|6|70",
"Quaker Oats|1|190",
"Quest Hard Toothbrush|6|30",
"Santoor Fresh Skin Soap|6|40",
"Santoor Sandal Turmeric Soap|6|42",
"Sensodyne Fresh Gel Toothpaste|6|130",
"Sensodyne Sensitive Toothbrush|6|80",
"Small Red Onions|7|45",
"Snickers|0|50",
"Sunfeast Dark Fantasy Choco Fills|0|30",
"Sunfeast Dark Fantasy Yumfills Pie|0|40",
"Sunsilk Stunning Black Shine|6|190",
"Tata Salt|2|28",
"Tata Tea Chakra Gold Elaichi|4|140",
"Tata Tea Chakra Gold Gemini|4|135",
"Thums Up 750ml|3|40",
"Thums Up Large Bottle|3|95",
"Toor Dal|1|160",
"Unibic Assorted Cookies|0|120",
"Unibic Butter Cookies|0|100",
"Unibic Choco Chip Cookies|0|110",
"Unibic Fruit Nut Cookies|0|115"
],C=[["All Products","▦"],["Biscuits & Snacks","🍟"],["Rice & Grains","🌾"],["Sugar & Salt","🧂"],["Beverages","🥤"],["Tea & Coffee","☕"],["Household Care","🧽"],["Personal Care","🧼"],["Fresh Produce","🥬"]];
const P=D.map(r=>{const[a,b,c]=r.split("|");return{n:a,c:C[+b+1][0],p:+c,i:"images/"+a.toLowerCase().replace(/[^a-z0-9]+/g,"_")+".png"}});
let cat="All Products",cart=new Map(),user=null;
try{cart=new Map(JSON.parse(localStorage.getItem("cart")||"[]"));user=localStorage.getItem("user")}catch(e){}
const $=i=>document.getElementById(i);
const save=()=>{try{localStorage.setItem("cart",JSON.stringify([...cart]));user?localStorage.setItem("user",user):localStorage.removeItem("user")}catch(e){}};
const total=()=>P.reduce((a,p)=>a+(cart.get(p.n)||0)*p.p,0);
const count=()=>[...cart.values()].reduce((a,b)=>a+b,0);
$("cg").innerHTML=C.map(c=>`<button data-c="${c[0]}">${c[1]} ${c[0]}</button>`).join("");
function render(){
 const q=$("q").value.trim().toLowerCase(),s=$("s").value;
 let L=P.filter(p=>(cat=="All Products"||p.c==cat)&&p.n.toLowerCase().includes(q));
 if(s=="a")L.sort((a,b)=>a.n.localeCompare(b.n));if(s=="z")L.sort((a,b)=>b.n.localeCompare(a.n));
 $("g").innerHTML=L.map(p=>{const n=cart.get(p.n)||0;return `<div class="card"><img src="${p.i}" alt="${p.n}"><h3>${p.n}</h3><div class="pr">₹${p.p}</div><button data-n="${p.n}" class="${n?'in':''}">${n?'In cart ('+n+') ✓':'Add to Cart'}</button></div>`}).join("");
 $("n").textContent=`(${L.length} items)`;$("ct").textContent=cat;$("empty").hidden=L.length>0;$("cc").textContent=count();
 $("lg").textContent=user?user.split(" ")[0]:"Login";
 document.querySelectorAll("#cg button").forEach(b=>b.classList.toggle("on",b.dataset.c==cat));
}
function goHome(){cat="All Products";$("q").value="";$("s").value="p";closeAll();scrollTo(0,0);render()}
function show(id){$("ov").hidden=false;$("cp").hidden=id!="cp";$("lf").hidden=id!="lf"}
function closeAll(){$("ov").hidden=true}
function openCart(){drawCart();show("cp")}
function drawCart(){
 const L=P.filter(p=>cart.has(p.n));
 $("ci").innerHTML=L.length?L.map(p=>`<div class="ci"><img src="${p.i}" alt=""><span>${p.n}<br><small>₹${p.p} × ${cart.get(p.n)} = ₹${p.p*cart.get(p.n)}</small></span><div class="q"><button data-m="${p.n}">−</button>${cart.get(p.n)}<button data-a="${p.n}">+</button></div><button class="rm" data-r="${p.n}">🗑</button></div>`).join(""):'<div class="muted">Your cart is empty</div>';
 $("cf").innerHTML=L.length?`<b>Items: ${count()} · Total: ₹${total()}</b><br><br><button class="btn" onclick="checkout()">Place Order</button>`:"";
}
function change(n,d){const v=(cart.get(n)||0)+d;v>0?cart.set(n,v):cart.delete(n);save();drawCart();render()}
function checkout(){if(!user){show("lf");return}alert("Thank you, "+user+"! Order placed for "+count()+" item(s). Total: ₹"+total()+".");cart.clear();save();closeAll();render()}
function openLogin(){if(user){if(confirm("Logout "+user+"?")){user=null;save();render()}}else show("lf")}
function doLogin(e){e.preventDefault();user=$("un").value.trim();save();closeAll();e.target.reset();render()}
$("ci").onclick=e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;if(d.m)change(d.m,-1);if(d.a)change(d.a,1);if(d.r){cart.delete(d.r);save();drawCart();render()}};
$("cg").onclick=e=>{const b=e.target.closest("button");if(b){cat=b.dataset.c;render()}};
$("g").onclick=e=>{const b=e.target.closest("button");if(b){cart.set(b.dataset.n,(cart.get(b.dataset.n)||0)+1);save();render()}};
$("q").oninput=render;$("s").onchange=render;render();
const u=new URLSearchParams(location.search);
if(u.get("q")){$("q").value=u.get("q");render()}
if(u.get("cart"))openCart();
if(u.get("login"))openLogin();
</script></body></html>
